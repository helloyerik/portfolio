<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yerik Kuanbayev</title>
    <meta
      name="description"
      content="Portfolio of a product designer focused on e-commerce, internal tools, and systems-driven product cases."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var storedTheme = null;
        var palette = "default";
        try {
          storedTheme = window.localStorage.getItem("portfolio-theme");
          var storedPalette = window.localStorage.getItem("portfolio-palette");
          palette = storedPalette === "default" || storedPalette === "gruvbox" ? storedPalette : "default";
        } catch (error) {
          storedTheme = null;
          palette = "default";
        }
        document.documentElement.dataset.theme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
        document.documentElement.dataset.palette = palette;
      })();
    </script>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
