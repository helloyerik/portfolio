<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yerik Kuanbayev</title>
    <meta
      name="description"
      content="Портфолио продуктового дизайнера с фокусом на e-commerce, внутренние сервисы и системные продуктовые кейсы."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Noto+Serif+JP:wght@300;400;600&family=Onest:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var storedTheme = null;
        var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var palette = "default";
        try {
          storedTheme = window.localStorage.getItem("portfolio-theme");
          palette = window.localStorage.getItem("portfolio-palette") === "gruvbox" ? "gruvbox" : "default";
        } catch (error) {
          storedTheme = null;
          palette = "default";
        }
        document.documentElement.dataset.theme =
          storedTheme === "light" || storedTheme === "dark" ? storedTheme : isDark ? "dark" : "light";
        document.documentElement.dataset.palette = palette;
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
